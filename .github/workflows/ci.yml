name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpl_planner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci

      # Prisma owns the schema — apply the same migrations the local test
      # DB uses (see apps/api/tests/conftest.py) so the SQLAlchemy models
      # under test are querying a real, current schema.
      - name: Apply Prisma migrations to the test database
        working-directory: packages/db
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fpl_planner_test

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: apps/api
        run: pytest -v
        env:
          # app/core/config.py's Settings() constructs eagerly at import
          # time (via app/db/base.py) and has no default — needs this set
          # even though the tests themselves connect via conftest.py's own
          # hardcoded TEST_DATABASE_URL, not this one.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fpl_planner_test

  frontend-unit:
    name: Frontend (lint + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Jest
        working-directory: apps/web
        run: npm test

  frontend-e2e:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpl_planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # No .env.local in CI (never committed — see apps/web/.env.example) —
      # these are the same values it documents, set directly as job env so
      # both `next dev` (via playwright.config.ts's webServer) and uvicorn
      # pick them up. AUTH_SECRET only needs to be *a* stable secret here,
      # not the real one. Google/Apple OAuth vars are deliberately left
      # unset — these E2E specs only exercise credentials sign-in/sign-up.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fpl_planner
      AUTH_SECRET: playwright-ci-secret-not-for-production-use
      API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci

      - name: Apply Prisma migrations
        working-directory: packages/db
        run: npx prisma migrate deploy

      # packages/db/generated/prisma is gitignored (build output, not
      # source) — apps/web's own code imports from it directly, so it has
      # to exist before `next dev` (started below by Playwright's
      # webServer) tries to compile anything that touches @fpl-planner/db.
      - name: Generate the Prisma client
        working-directory: packages/db
        run: npx prisma generate

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Start the FastAPI backend
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
        env:
          # Same Postgres, asyncpg driver prefix — see apps/api/.env.example.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fpl_planner

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "Backend never became healthy:"
          cat apps/api/uvicorn.log
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
